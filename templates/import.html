{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-12 col-md-8 col-lg-6">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="h3 mb-0 text-body fw-bold">Import Data <span class="text-primary">({{ model|title }})</span></h2>
        </div>
        
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="text-primary mb-3" style="font-size: 3rem;">
                        <i class="fas fa-file-excel"></i>
                    </div>
                    <p class="text-muted">Upload an Excel file (.xlsx) to import records into the system.</p>
                </div>
                
                <form method="post" enctype="multipart/form-data">
                    {% csrf_token %}
                    <div class="mb-4">
                        <label for="file" class="form-label text-muted small fw-medium">Choose Excel File</label>
                        <input type="file" name="file" class="form-control form-control-lg" accept=".xlsx" required>
                    </div>
                    
                    <div class="d-grid mt-4">
                        <button type="submit" class="btn btn-primary rounded-pill py-2 shadow-sm fw-bold">
                            <i class="fas fa-upload me-2"></i>Upload and Import
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
